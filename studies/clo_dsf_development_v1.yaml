schema_version: 7
purpose: DEVELOPMENT / TUNING DATA — NOT FINAL HOLDOUT
split_seed: 17092026
grouping: origin + model + behavior; all severities, durations, operating profiles and onset times stay together
split: stratified by origin; lowest SHA256(seed:group) groups form ceil(0.30 * groups) validation
simulation_duration_ms: 120000
injection_times_ms: [25000, 65000]
durations_ms: [200, 2000, 8000]
behaviors: [transient, intermittent, permanent]
profiles:
  - {name: moderate, load: 0.45, speed: 55, ambient: 25}
  - {name: urban, load: 0.70, speed: 15, ambient: 30}
  - {name: highway, load: 0.80, speed: 95, ambient: 28}
  - {name: hot_idle, load: 0.95, speed: 0, ambient: 38}
models:
  MEMORY:
    bit_flip: [0, 3, 5]
    stuck_bit: [0, 3, 5]
  TIMING:
    deadline_miss: [100, 400, 1000]
    task_delay: [100, 300, 700]
  COMMUNICATION:
    delayed_update: [100, 500]
    dropped_update: [1, 5]
    replayed_sample: [200, 800]
  SENSOR_CONTROL:
    sensor_bias: [-2, 4, 10]
    sensor_interface_intermittent: [2, 6, 12]
  ACTUATOR:
    pump_degraded: [0.85, 0.55, 0.20]
    fan_stuck_off: [0, 0, 0]  # severity index varies duration; permanent fan uses distinct onset offsets below
deadline_transient_onset_offsets_ms: [0, 1000, 2000]
legacy_intermittent: two existing custom_multi transient events separated by 1000 ms; no new injection semantics
fan_permanent_onset_offsets_ms: [0, 1000, 2000]
benign_profiles_per_template: 48
benign_variation: 4 load offsets x 4 speed offsets x 3 ambient offsets; each is a distinct generated profile
parameter_search:
  r_direct: [0.9]
  r_indirect: [0.6]
  lambda_temporal: [0.8, 0.9]
  propagation_bonus: [0.1]
  propagation_window_ms: [3000]
  alarm_threshold_suspect: [0.35]
  alarm_threshold_confirmed: [0.65, 0.75]
  confirmation_persistence: [2]
  localization_threshold: [0.55]
  localization_margin_threshold: [0.15]
  ignorance_limit: [0.5]
  conflict_rule: [yager, dempster]
selection_rule: lexicographic minimize benign false-alarm runs, maximize macro origin coverage, minimize silent plant propagation, maximize correct localization per alarm, minimize median latency, minimize high-conflict runs, candidate index
freeze_gate: zero train benign false alarms, validation macro coverage >= 0.50, validation localized precision >= 0.70, all isolation and regression tests passing; document comparison deficits
